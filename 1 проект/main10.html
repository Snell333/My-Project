<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <Title>Возможности языка CSS</Title>
        <link rel="stylesheet" href="main9.css">
        <link rel="stylesheet" href="bootstrap.min10.css">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Методогия</title>
    </head>
    <body>
        <div class="container bg-block">
            <div class="row">
                <div class="col">
                    <h1>Row 1 Col 2</h1>
                </div>
                <div class="col">
                    <h1>Row 1 Col 2</h1>
                </div>
            </div>
            <div class="row">
                <div class="col bg-block-2">
                    <h1>Row  1 Col 2</h1>
                </div>
                <div class="col">
                    <h1>Row 1 Col 2</h1>
                </div>
                <div class="col bg-block-2">
                    <h1>Row 1 Col 2</h1>
                </div>
                <div class="col-4">
                    <h1>Row 1 Col 2</h1>
                </div>
                <h1>Row 2</h1>
            </div>
            <div class="row">
                <h1>Row 3</h1>
            </div>
        </div>
    </body>
</html>

<!-- offset атрибут для отступа с лева для ячеек  -->
<!-- row - класс который создает ряд -->
<!-- col - класс который создат столбцы col-2 - это указание ширины столбца сколько ячеек он будет занимать макс 12 ячеек -->
 <!-- bg-warning - класс который установит желтый цвет  сзади -->
<!-- text-danger - класс который установит красный цве сзади -->
<!-- text-center - класс расположит текст внутри блока по центру -->
<!-- display-1 - класс что размер текста в теге p будет больших размеров -->
<!-- form-horizontal - класс, что позволит расположить элементы формы горизонтально -->
<!-- form-control - класс используется для стилизации input полей -->
<!-- btn-group - класс, что используется для блока с группой кнопок -->
<!-- btn btn-warning - класс красивую кнопку с желтым фоном при помощи специальных классов Bootstrap -->
<!-- btn-outline-danger - класс создает прозрачную кнопку с обводкой красного цвета -->
<!-- float-right - класс что расположит блок по правую сторону при помощи float позиционирования -->
<!-- card-title - класс для создания карточки с информацией -->
<!-- table - основной класс, что используется для стилизации таблицы -->
<!-- alert-light - блок серого цвета, что может быть использован для информационного оповещания -->
<!-- img-thumbnail - класс для добавления стилей к изображению -->
<!-- badge - блок по типу  -->
